---
# Ubuntu/Debian counterpart of fedora-zsh.yml.
# Sets up zsh + powerlevel10k, LazyVim, and the RHOAI QE CLI toolchain,
# then clones the work repos (master/main only).
#
#   ansible-playbook -K ubuntu-zsh.yml
#   ansible-playbook -K ubuntu-zsh.yml --tags cli        # just the CLIs
#   ansible-playbook -K ubuntu-zsh.yml --skip-tags repos # no GitLab access yet
#
# Override identity / versions with -e, e.g.:
#   ansible-playbook -K ubuntu-zsh.yml -e git_user_email=you@example.com

- name: Ubuntu zsh + RHOAI QE toolchain
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    home: "{{ ansible_env.HOME }}"
    local_bin: "{{ ansible_env.HOME }}/.local/bin"

    git_user_name: "Omri Bar Haim"
    git_user_email: "obarhaim@redhat.com"

    # Pinned binary releases (bump deliberately)
    yq_version: "4.45.1"
    uv_version: "0.12.10"
    node_major: "22"

    # Work repos: default branch only, no feature branches carried over
    work_repos:
      - name: jenkins
        repo: git@gitlab.cee.redhat.com:obarhaim/jenkins.git
        branch: master
        upstream: git@gitlab.cee.redhat.com:ods/jenkins.git
      - name: rhods-qe-tools
        repo: git@gitlab.cee.redhat.com:obarhaim/rhods-qe-tools.git
        branch: main
        upstream: git@gitlab.cee.redhat.com:ods/rhods-qe-tools.git

  pre_tasks:
    - name: Refuse to run on non-Debian systems
      ansible.builtin.assert:
        that: ansible_os_family == 'Debian'
        fail_msg: "ubuntu-zsh.yml targets Debian/Ubuntu. Use fedora-zsh.yml on Fedora/RHEL."

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ local_bin }}"
        state: directory
        mode: "0755"

  tasks:
    - name: Install apt packages
      ansible.builtin.include_tasks:
        file: tasks/ubuntu/apt_packages.yml
        apply:
          tags: [packages]
      tags: [packages, always]

    - name: Configure zsh, oh-my-zsh and powerlevel10k
      ansible.builtin.include_tasks:
        file: tasks/ubuntu/zsh.yml
        apply:
          tags: [zsh]
      tags: [zsh]

    - name: Install fonts
      ansible.builtin.include_tasks:
        file: tasks/ubuntu/fonts.yml
        apply:
          tags: [fonts]
      tags: [fonts]

    - name: Install and configure LazyVim
      ansible.builtin.include_tasks:
        file: tasks/lazyvim_playbook.yml
        apply:
          tags: [nvim]
      tags: [nvim]

    - name: Install OpenShift CLIs
      ansible.builtin.include_tasks:
        file: tasks/common/openshift_clis.yml
        apply:
          tags: [cli]
      tags: [cli]

    - name: Install cloud and dev CLIs
      ansible.builtin.include_tasks:
        file: tasks/ubuntu/cli_tools.yml
        apply:
          tags: [cli]
      tags: [cli]

    - name: Configure git and clone work repos
      ansible.builtin.include_tasks:
        file: tasks/common/repos.yml
        apply:
          tags: [repos]
      tags: [repos]
